# Master resume: everything I've ever done, in one place.
#
# Each tailored resume in variants/ is an override on top of this file.
# See resume/README.md for the full rules. The short version:
#
#   sections.<id>          one job / degree / project / list. Metadata depends on `kind`.
#   sections.<id>.items    the bullets ("subsections"). Each has an optional `topic`
#                          (rendered "Topic - text") and a `text` (a plain bullet if no topic).
#                          Optional: `group` (sub-heading, e.g. a mission name) and
#                          `details` (a list of nested bullets).
#   sections.<id>.order    which items show, in what order. Leave it out to show every item.
#                          Alternate phrasings of the same fact live here as separate items,
#                          and `order` picks the default one.
#
# kinds:
#   entry         title / org / location / start / end header row + items. Jobs, degrees,
#                 projects, plain bullet lists (leave the header fields out).
#   publications  items have title / authors / venue.
#   skills        items have name / since / until / level / years. `years` is computed from
#                 since..until (or this year) when left out.
#
# `heading` is the big section header. Consecutive sections with the same heading share one.

